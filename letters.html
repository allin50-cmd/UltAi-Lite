<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Accuracy Letter Desk</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#171717;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1050px;margin:auto;padding:18px}.muted{color:#6b675f;font-size:13px;line-height:1.45}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6b675f}h1{margin:5px 0 3px;font-size:34px}.bar,.card{background:#fff;border:1px solid #ddd7cc;border-radius:16px}.bar{padding:12px;margin:16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn,button,input,textarea{font:inherit}.btn,button{border:1px solid #ddd7cc;background:#fff;color:#171717;border-radius:999px;padding:10px 13px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#171717;color:#fff;border-color:#171717}.good{background:#245c3b;color:#fff;border-color:#245c3b}.card{padding:15px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:14px}.tag{display:inline-block;background:#f0ece4;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;margin-right:5px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.fields input,.fields textarea{width:100%;border:1px solid #ddd7cc;border-radius:12px;padding:10px;background:#fff}.fields textarea{grid-column:1/-1;min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #eee8df;padding-top:11px;margin-top:12px}.check{width:22px;height:22px}.letter{display:none;background:#fff}.letterbar{position:sticky;top:0;z-index:5;padding:10px;background:#eee;border-bottom:1px solid #ddd;text-align:center}.paper{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:0 24mm 18mm;page-break-after:always}.paper:last-child{page-break-after:auto}.lh{background:#111;color:#fff;margin:0 -24mm 15mm;padding:9mm 24mm;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.08em}.contact{font-size:9px;text-align:right;line-height:1.5}.green{height:3px;background:#2e7d32;margin:0 -24mm 10mm}.paper p{font-size:11px;line-height:1.65}.paper h2{font-size:17px}.box{border-left:4px solid #2e7d32;background:#f7faf7;padding:5mm;margin:7mm 0}.empty{padding:38px;text-align:center;color:#6b675f}@media(max-width:720px){.top{display:block}.fields{grid-template-columns:1fr}.fields textarea{grid-column:1}.paper{width:100%;min-height:auto;padding:18px}.lh{margin:-18px -18px 18px;padding:18px}.green{margin:0 -18px 18px}.btn,button{min-height:44px}}@page{size:A4;margin:0}@media print{#desk,.letterbar{display:none!important}.letter{display:block!important}.paper{width:210mm;min-height:297mm;margin:0;box-shadow:none}}</style></head><body><div id="desk" class="w"><div class="eyebrow">ULTAI · ACCURACY DEVELOPMENTS LTD</div><h1>Letter Desk</h1><div class="muted">Approved Accuracy opportunities from PIE. Correct recipient details, select letters, then print individually or as one batch.</div><div class="bar"><a class="btn" href="/accuracy">← PIE Daily</a><button onclick="render()">Refresh</button><button id="selectReady">Select all ready</button><button id="clearSel">Clear selection</button><button id="batchPrint" class="primary">Print selected</button><span id="selCount" class="muted">0 selected</span></div><div id="list"></div></div><div id="letter" class="letter"><div class="letterbar"><button class="primary" onclick="window.print()">Print / Save PDF</button> <button onclick="back()">Back to Letter Desk</button></div><div id="papers"></div></div><script>(function(){'use strict';var KEY='accuracy_pie_daily_v2',state={history:{},currentBatch:''},selected={};function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function load(){try{state=JSON.parse(localStorage.getItem(KEY)||'{}');state.history=state.history||{}}catch(e){state={history:{},currentBatch:''}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function items(){return Object.keys(state.history).map(function(k){var x=state.history[k];x._key=k;if(!x.recipient)x.recipient='Homeowner';if(!x.postal_address)x.postal_address=x.address;return x}).filter(function(x){return x.review_status==='APPROVED'})}function field(k,f){var all=document.querySelectorAll('[data-f="'+f+'"]');for(var i=0;i<all.length;i++){if(all[i].dataset.k===k)return all[i].value.trim()}return''}function persistFields(k){var x=state.history[k];if(!x)return;x.recipient=field(k,'recipient')||x.recipient||'Homeowner';x.postal_address=field(k,'postal_address')||x.postal_address||x.address;save()}function render(){load();var xs=items();$('selCount').textContent=Object.keys(selected).length+' selected';$('list').innerHTML=xs.length?xs.map(function(x){return '<article class="card"><div class="top"><div><div><input class="check" type="checkbox" data-sel="'+esc(x._key)+'" '+(selected[x._key]?'checked':'')+'> <span class="tag">'+esc(x.council)+'</span><span class="tag">'+esc(x.reference)+'</span></div><h3>'+esc(x.address)+'</h3><div class="muted">'+esc(x.description)+'</div></div><div><b>'+(x.posted_at?'POSTED':'LETTER READY')+'</b></div></div><div class="fields"><input data-f="recipient" data-k="'+esc(x._key)+'" value="'+esc(x.recipient)+'" placeholder="Recipient name"><textarea data-f="postal_address" data-k="'+esc(x._key)+'" placeholder="Postal address">'+esc(x.postal_address)+'</textarea></div><div class="actions"><button class="good" data-a="save" data-k="'+esc(x._key)+'">Save recipient</button><button class="primary" data-a="print" data-k="'+esc(x._key)+'">Print this letter</button>'+(x.posted_at?'':'<button data-a="posted" data-k="'+esc(x._key)+'">Mark posted</button>')+'</div></article>'}).join(''):'<div class="empty">No approved letters yet. Approve opportunities in PIE Daily first.</div>'}function paper(x){var date=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});return '<article class="paper"><header class="lh"><div class="brand">ACCURACY<br><small>DEVELOPMENTS LTD</small></div><div class="contact">Dagon White · Director<br>+44 7825 600471<br>info@accuracydevelopmentsltd.co.uk<br>accuracydevelopmentsltd.co.uk</div></header><div class="green"></div><p>'+esc(x.recipient||'Homeowner')+'<br>'+esc(x.postal_address||x.address)+'<span style="float:right">'+date+'</span></p><h2>Re: Planning Application – '+esc(x.address)+'</h2><p><strong>Congratulations on progressing your plans for the property.</strong></p><p>We have reviewed the publicly available planning information relating to application <strong>'+esc(x.reference)+'</strong> and identified it as a project that may be a good fit for Accuracy Developments Ltd.</p><p>Accuracy Developments is a local construction company delivering residential extensions, refurbishments, conversions and new-build work across South London and the surrounding area.</p><div class="box"><strong>How we can help</strong><p>• Review the drawings and proposed scope.<br>• Discuss buildability, sequencing and next steps.<br>• Prepare a clear quotation and programme where suitable.<br>• Coordinate construction from pre-start through completion.</p></div><p>If a short project conversation would be useful, please call Dagon White on <strong>+44 7825 600471</strong> or email <strong>info@accuracydevelopmentsltd.co.uk</strong>, quoting planning reference <strong>'+esc(x.reference)+'</strong>.</p><p>Kind regards,<br><br><strong>Dagon White</strong><br>Director<br>Accuracy Developments Ltd</p></article>'}function openKeys(keys){keys.forEach(function(k){persistFields(k)});load();var xs=keys.map(function(k){return state.history[k]}).filter(Boolean);if(!xs.length)return;$('papers').innerHTML=xs.map(paper).join('');$('desk').style.display='none';$('letter').style.display='block';scrollTo(0,0)}window.back=function(){$('letter').style.display='none';$('desk').style.display='block';render();scrollTo(0,0)}$('selectReady').onclick=function(){items().filter(function(x){return !x.posted_at}).forEach(function(x){selected[x._key]=true});render()};$('clearSel').onclick=function(){selected={};render()};$('batchPrint').onclick=function(){var keys=Object.keys(selected);if(!keys.length){alert('Select at least one approved letter first.');return}openKeys(keys)};$('list').onchange=function(e){if(e.target.dataset.sel!==undefined){var k=e.target.dataset.sel;if(e.target.checked)selected[k]=true;else delete selected[k];render()}};$('list').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var k=b.dataset.k;if(!state.history[k])return;if(b.dataset.a==='save'){persistFields(k);render()}else if(b.dataset.a==='print'){openKeys([k])}else if(b.dataset.a==='posted'){persistFields(k);state.history[k].posted_at=new Date().toISOString();save();render()}};render();})();</script></body></html>
