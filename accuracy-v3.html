<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Accuracy PIE v3</title><style>body{font-family:Arial;margin:0;background:#f6f4ef;color:#171717}.w{max-width:1100px;margin:auto;padding:18px}button,.btn,input{font:inherit;padding:10px 13px;border:1px solid #ddd7cc;border-radius:999px;background:#fff}.btn{display:inline-block;text-decoration:none;color:inherit;font-weight:700}.primary{background:#171717;color:#fff}.good{background:#245c3b;color:#fff}.bad{color:#922d22}.bar,.card{background:#fff;border:1px solid #ddd7cc;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#fff;border:1px solid #ddd7cc;border-radius:14px;padding:12px;min-width:120px}.stat b{font-size:24px;display:block}.tag{font-size:11px;font-weight:800;background:#f0ece4;padding:5px 8px;border-radius:999px}.strong{color:#245c3b}.review{color:#9a6700}.reject{color:#922d22}.why{background:#f0ece4;padding:10px;border-radius:12px;font-size:13px;line-height:1.5}.muted{color:#6b675f;font-size:13px}.parent{margin-top:8px;padding:10px;border-left:4px solid #9a6700;background:#fff8e6}.file input{display:none}@media(max-width:650px){button,.btn{min-height:44px}.stat{flex:1}}</style><main class=w><div class=muted>ULTAI · ACCURACY DEVELOPMENTS LTD</div><h1>PIE Daily Planning Review</h1><p class=muted>Fresh Bromley/Lewisham CSV → PIE → human review → Letter Desk.</p><div class="bar row"><label class="btn primary file">Choose today's CSV<input id=f type=file accept=".csv,text/csv"></label><a class=btn href=/letters>Letter Desk</a><span id=msg class=muted></span></div><div class=stats><div class=stat><b id=total>0</b>Total</div><div class=stat><b id=today>0</b>Today</div><div class=stat><b id=strong>0</b>Strong</div><div class=stat><b id=review>0</b>Review</div><div class=stat><b id=letters>0</b>Letters</div></div><div class="bar row"><button data-v=today class=primary>Today</button><button data-v=recommended>Recommended</button><button data-v=rejected>Rejected</button><button data-v=all>All history</button><input id=q placeholder="Search address or reference" style="flex:1;min-width:210px"></div><div id=list></div></main><script>(function(){'use strict';var KEY='accuracy_pie_daily_v2',H={},batch='',view='today';function $(x){return document.getElementById(x)}function load(){try{var z=JSON.parse(localStorage.getItem(KEY)||'{}');H=z.history||{};batch=z.currentBatch||''}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify({history:H,currentBatch:batch}));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function key(r){return(r.council||'').toLowerCase()+'::'+(r.reference||'').toUpperCase()}function csv(t){var a=[],r=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){r.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(f);f='';if(r.some(function(v){return String(v).trim()}))a.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);a.push(r)}var h=(a.shift()||[]).map(function(x){return x.trim().toLowerCase()});return a.map(function(x){var o={};h.forEach(function(k,i){o[k]=x[i]||''});return o})}function parentRef(r){var m=(r.description||'').match(/(?:permission|reference|application)(?:\s+reference)?\s+((?:DC\/)?[0-9]{2}\/[0-9]{4,6}(?:\/[A-Z0-9]+)?)/i);return m?m[1].toUpperCase():''}function url(c){return/lewisham/i.test(c||'')?'https://planning.lewisham.gov.uk/online-applications/':'https://www.bromley.gov.uk/planningaccess'}function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();return Promise.resolve()}function lookup(x){window.open(url(x.council),'_blank','noopener');copy(x.parent_reference).then(function(){$('msg').textContent='Copied '+x.parent_reference+'. Paste it into '+x.council+' planning search.'})}function score(r){var d=(r.description||'').toLowerCase(),ref=(r.reference||'').toUpperCase(),s=0,w=[];if(/\/TCA|\/TPO|\/CON/.test(ref)||/\btree\b|fell to ground|air source heat pump|details submitted to comply/.test(d))return[5,'REJECT',['Non-core / low-value planning activity']];if(/\/LDC/.test(ref)||/lawful development certificate/.test(d))return[15,'REJECT',['Certificate-only application']];if(/new dwelling|dwellinghouse|two-bedroom dwelling|erection of .*dwelling/.test(d)){s+=55;w.push('New dwelling / whole-build scope')}if(/two storey|two-storey/.test(d)){s+=12;w.push('Two-storey construction')}if(/demolition.*dwelling/.test(d)){s+=18;w.push('Demolition + rebuild')}if(/swimming pool/.test(d)){s+=10;w.push('High-value additional element')}if(/rear and side extension|side and rear extension/.test(d)){s+=55;w.push('Combined rear + side extension')}else if(/extension/.test(d)){s+=30;w.push('Residential extension')}if(/outbuilding/.test(d)){s+=18;w.push('Additional outbuilding')}if(/demolition.*garage/.test(d)){s+=12;w.push('Garage demolition')}if(/minor material amendment|section 73/.test(d)||/\/S73/.test(ref)){var p=parentRef(r);if(s>=45){s+=10;w.push('Amendment to substantial scheme')}else{s=Math.max(s,35);w.push('Amendment — parent permission needs review')}if(p)w.push('Parent planning reference detected: '+p)}var c=s>=55?'STRONG':s>=30?'REVIEW':'REJECT';if(!w.length)w=['No strong £50k+ construction signal'];return[Math.min(100,s),c,w]}function ingest(t){var rows=csv(t),need=['council','reference','address','description','status','date_validated','date_decision','url'];if(!rows.length||need.some(function(k){return!(k in rows[0])})){$('msg').textContent='CSV columns do not match council export.';return}batch=new Date().toISOString();var add=0;rows.forEach(function(r){var k=key(r),a=score(r),old=H[k];if(!old){old={review_status:a[1]==='REJECT'?'AUTO_REJECTED':'PENDING',posted_at:null,outcome:'OPEN',first_seen:batch};add++}old.council=r.council;old.reference=r.reference;old.address=r.address;old.description=r.description;old.status=r.status;old.date_validated=r.date_validated;old.date_decision=r.date_decision;old.url=r.url;old.pie_score=a[0];old.classification=a[1];old.why=a[2];old.parent_reference=parentRef(r);old.last_batch=batch;H[k]=old});save();$('msg').textContent='Processed '+rows.length+' rows · '+add+' new.'}function stage(x){if(x.posted_at)return'POSTED';if(x.review_status==='APPROVED')return'LETTER';if(x.review_status==='REJECTED'||x.review_status==='AUTO_REJECTED')return'REJECTED';return x.classification}function items(){return Object.keys(H).map(function(k){H[k]._k=k;return H[k]})}function render(){var a=items(),q=$('q').value.toLowerCase();$('total').textContent=a.length;$('today').textContent=a.filter(function(x){return x.last_batch===batch}).length;$('strong').textContent=a.filter(function(x){return stage(x)==='STRONG'}).length;$('review').textContent=a.filter(function(x){return stage(x)==='REVIEW'}).length;$('letters').textContent=a.filter(function(x){return stage(x)==='LETTER'}).length;var v=a.filter(function(x){var st=stage(x),ok=view==='all'||view==='today'&&x.last_batch===batch||view==='recommended'&&(st==='STRONG'||st==='REVIEW'||st==='LETTER')||view==='rejected'&&st==='REJECTED';return ok&&(!q||(x.address+' '+x.reference+' '+x.description).toLowerCase().includes(q))}).sort(function(a,b){return b.pie_score-a.pie_score});$('list').innerHTML=v.length?v.map(function(x){var st=stage(x),p=x.parent_reference?'<div class=parent><b>Parent scheme:</b> '+esc(x.parent_reference)+'<div class=row style="margin-top:8px"><button data-a=parent data-k="'+esc(x._k)+'">Copy ref & open '+esc(x.council)+' search</button></div></div>':'';var act=(st==='STRONG'||st==='REVIEW')?'<button class=good data-a=approve data-k="'+esc(x._k)+'">Approve</button> <button class=bad data-a=reject data-k="'+esc(x._k)+'">Reject</button>':st==='LETTER'?'<a class="btn primary" href=/letters>Open Letter Desk</a>':'';return'<article class=card><div class=row><span class="tag '+x.classification.toLowerCase()+'">'+esc(x.classification)+'</span><span class=tag>'+esc(x.council)+'</span><span class=tag>'+esc(x.reference)+'</span><b style="margin-left:auto">PIE '+x.pie_score+'</b></div><h3>'+esc(x.address)+'</h3><p>'+esc(x.description)+'</p><div class=why>'+x.why.map(function(z){return'✓ '+esc(z)}).join('<br>')+'</div>'+p+'<div class=row>'+act+(x.url?' <a class=btn target=_blank rel=noopener href="'+esc(x.url)+'">Council record</a>':'')+'</div></article>'}).join(''):'<div class="card muted">Nothing in this view.</div>'}document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){view=b.dataset.v;document.querySelectorAll('[data-v]').forEach(function(x){x.classList.remove('primary')});b.classList.add('primary');render()}});$('q').oninput=render;$('list').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var x=H[b.dataset.k];if(!x)return;if(b.dataset.a==='parent'){lookup(x);return}if(b.dataset.a==='approve')x.review_status='APPROVED';else if(b.dataset.a==='reject')x.review_status='REJECTED';save()};$('f').onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ingest(r.result)};r.readAsText(f);e.target.value=''};load();render()})();</script>
